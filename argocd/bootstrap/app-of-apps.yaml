apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: epic-bootstrap
  namespace: 6cdc9e-tools
  annotations:
    argocd.argoproj.io/controller-instance-name: epic-argocd
spec:
  project: epic-project
  source:
    repoURL: 'https://github.com/bcgov/eagle-helper-pods.git'
    targetRevision: master
    path: argocd/apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: 6cdc9e-tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
