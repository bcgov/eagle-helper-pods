apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: epic-bootstrap
  namespace: 6cdc9e-tools
spec:
  project: 6cdc9e
  source:
    repoURL: 'https://github.com/bcgov/eagle-helper-pods.git'
    targetRevision: main
    path: argocd/apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: 6cdc9e-tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
