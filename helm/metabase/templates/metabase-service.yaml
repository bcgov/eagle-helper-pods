apiVersion: v1
kind: Service
metadata:
  name: {{ include "metabase.fullname" . }}
  labels:
    {{- include "metabase.labels" . | nindent 4 }}
spec:
  ports:
    - name: 3000-tcp
      port: {{ .Values.metabase.port }}
      protocol: TCP
      targetPort: {{ .Values.metabase.port }}
  selector:
    name: {{ include "metabase.fullname" . }}
  type: ClusterIP
