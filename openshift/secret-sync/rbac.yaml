---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-sync
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps.openshift.io"]
    resources: ["deploymentconfigs"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-sync
subjects:
  - kind: ServiceAccount
    name: secret-sync
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-sync-token
  annotations:
    kubernetes.io/service-account.name: secret-sync
type: kubernetes.io/service-account-token
